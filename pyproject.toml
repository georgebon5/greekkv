[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greekkv"
version = "0.0.1"
description = "Open-source study + toolkit measuring KV-cache quantization quality/capacity trade-offs on Greek LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Giorgos Mponobas" }]
keywords = ["llm", "kv-cache", "quantization", "greek", "inference"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Heavy deps (torch, transformers, datasets, bitsandbytes) are added in the tasks
# that first require them. Core library deps stay tiny so `pip install -e .`
# works on CPU-only CI without pulling multi-GB wheels.
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # Pinned <4 because datasets>=4 removed script-based dataset support, which
    # Muennighoff/flores200 still relies on. Migration to a parquet-based FLORES
    # mirror (openlanguagedata/flores_plus) requires HF auth and will be its
    # own task.
    "datasets>=2.18,<4",
    "transformers>=4.40",
    "numpy>=1.24",
    # torch is needed from T07 onward to validate memory formulas against real
    # tensors and (later) to run inference. CPU wheels suffice for development.
    "torch>=2.1",
    "matplotlib>=3.7",
    # psutil for cross-platform RSS sampling (T23 profiler on CPU).
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/georgebon5/greekkv"

[tool.hatch.build.targets.wheel]
packages = ["src/greekkv"]

# ----------------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]  # test method names

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
pythonpath = ["src"]
