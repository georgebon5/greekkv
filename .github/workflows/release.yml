name: Release

# Triggers on any version tag (v0.1.0, v0.1.1, …). Reads the matching
# docs/RELEASE_NOTES_<tag>.md as the GitHub release body, attaches the
# canonical result artefacts, and uploads the sdist + wheel. The tag
# must already exist — this workflow never creates it.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build + publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes=docs/RELEASE_NOTES_${TAG}.md" >> "$GITHUB_OUTPUT"

      - name: Verify release notes exist
        run: |
          test -f "${{ steps.tag.outputs.notes }}" \
            || (echo "missing ${{ steps.tag.outputs.notes }}"; exit 1)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file "${{ steps.tag.outputs.notes }}" \
            dist/*.whl \
            dist/*.tar.gz \
            docs/RESULTS.md \
            docs/capacity.md \
            docs/systems_profile.md \
            docs/kernel_bench.md \
            docs/dashboard.md
